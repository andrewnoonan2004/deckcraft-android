[workspace]

[package]
name = "deckcraft-android-bridge"
version = "0.16.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "JNI + OpenGL ES 3.0 bridge embedding DeckCraft's full egui presentation workbench on Android"

[lib]
name = "deckcraft_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
deckcraft-ui-egui = { path = "../deckcraft/crates/ui-egui" }
deckcraft-engine = { path = "../deckcraft/crates/engine" }
deckcraft-model = { path = "../deckcraft/crates/model" }
egui = { version = "0.37", default-features = false, features = ["bytemuck", "default_fonts", "monochrome_emoji_fonts"] }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a", default-features = false }
glow = "0.17"
jni = "0.21"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
arboard = { path = "shims/arboard" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[patch.crates-io]
arboard = { path = "shims/arboard" }
krilla = { git = "https://github.com/storytold/craft-libs.git", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "none"
